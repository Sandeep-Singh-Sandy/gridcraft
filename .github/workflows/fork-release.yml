# Builds the Windows installer (MSI + portable zip) and publishes it as a GitHub release of this
# fork. The version comes from Cargo.toml, so a release is made once per version: when upstream
# bumps it and the fork is synced, the next run publishes it. GridCraft's update check reads
# these releases (see UPDATE_APP in crates/ui-egui/src/lib.rs).
name: Fork release

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, e.g. 0.17.0-1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and skip it if already released
        id: ver
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if (-not $v) { $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value }
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          "version=$v" >> $env:GITHUB_OUTPUT
          "build=$((-not $exists).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Output "v$v already released: $exists"

      - name: Rust and WiX
        if: steps.ver.outputs.build == 'true'
        shell: pwsh
        run: |
          rustup update stable
          dotnet tool install --global wix --version 5.0.2

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.build == 'true'

      - name: Package
        if: steps.ver.outputs.build == 'true'
        shell: pwsh
        env:
          GRIDCRAFT_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          ./packaging/windows/package.ps1 -Arch x64
          Set-Location dist/release
          Get-ChildItem gridcraft-* | ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish the release
        if: steps.ver.outputs.build == 'true'
        shell: pwsh
        run: gh release create "v${{ steps.ver.outputs.version }}" dist/release/* --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "GridCraft ${{ steps.ver.outputs.version }}" --generate-notes
